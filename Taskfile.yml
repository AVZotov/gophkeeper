version: '3'

vars:
  VERSION:
    sh: git describe --tags --always --dirty
  BUILD_DATE: '{{dateInZone "2006-01-02T15:04:05Z07:00" now "UTC"}}'
  LDFLAGS: -X main.version={{.VERSION}} -X main.buildDate={{.BUILD_DATE}}
  PROTOC_VERSION: libprotoc 36.2
  PROTO_FILES: api/gophkeeper/v1/gophkeeper.proto internal/client/recordpb/record.proto
  CERT_DAYS: 365

tasks:
  proto:
    desc: Generate Go code from .proto files ({{.PROTOC_VERSION}} required)
    vars:
      PROTOC_GOT:
        sh: protoc --version 2>&1 || true
    preconditions:
      - sh: '[ "{{.PROTOC_GOT}}" = "{{.PROTOC_VERSION}}" ]'
        msg: 'protoc: want {{.PROTOC_VERSION}}, got {{.PROTOC_GOT}}'
    cmds:
      # go tool -n builds the plugins pinned in go.mod and prints their paths,
      # so protoc never picks up other versions from PATH.
      - >-
        protoc -I .
        --plugin=protoc-gen-go="$(go tool -n protoc-gen-go)"
        --plugin=protoc-gen-go-grpc="$(go tool -n protoc-gen-go-grpc)"
        --go_out=. --go_opt=paths=source_relative
        --go-grpc_out=. --go-grpc_opt=paths=source_relative
        {{.PROTO_FILES}}

  build:
    desc: Build the client and the server into bin/
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o bin/ ./cmd/gophkeeper
      - go build -o bin/ ./cmd/server

  build:all:
    desc: Cross-compile the client for Windows, Linux and macOS
    env:
      CGO_ENABLED: '0'
    cmds:
      - for:
          matrix:
            OS: [windows, linux, darwin]
            ARCH: [amd64, arm64]
        cmd: GOOS={{.ITEM.OS}} GOARCH={{.ITEM.ARCH}} go build -ldflags "{{.LDFLAGS}}" -o bin/{{.ITEM.OS}}-{{.ITEM.ARCH}}/ ./cmd/gophkeeper

  db:up:
    desc: Start PostgreSQL for development and wait until it is ready
    cmds:
      - docker compose up -d --wait

  db:down:
    desc: Stop PostgreSQL for development, keeping its data
    cmds:
      - docker compose down

  certs:
    desc: Create a development CA and a server certificate for localhost and 127.0.0.1 in certs/
    # Commands work with both OpenSSL and LibreSSL. Existing certificates are
    # kept, so clients that trust the CA keep working; delete certs/ to renew.
    # Keys are created with umask 077 in sh: the Task shell has no umask.
    status:
      - test -f certs/ca.crt -a -f certs/server.crt -a -f certs/server.key
    cmds:
      - mkdir -p certs
      - printf 'basicConstraints=critical,CA:TRUE\nkeyUsage=critical,keyCertSign,cRLSign\n' > certs/ca.ext
      - printf 'basicConstraints=critical,CA:FALSE\nkeyUsage=critical,digitalSignature\nextendedKeyUsage=serverAuth\nsubjectAltName=DNS:localhost,IP:127.0.0.1\n' > certs/server.ext
      - sh -c 'umask 077 && openssl ecparam -name prime256v1 -genkey -noout -out certs/ca.key'
      - openssl req -new -key certs/ca.key -subj "/CN=GophKeeper dev CA" -out certs/ca.csr
      - openssl x509 -req -in certs/ca.csr -signkey certs/ca.key -days {{.CERT_DAYS}} -sha256 -extfile certs/ca.ext -out certs/ca.crt
      - sh -c 'umask 077 && openssl ecparam -name prime256v1 -genkey -noout -out certs/server.key'
      - openssl req -new -key certs/server.key -subj "/CN=localhost" -out certs/server.csr
      - openssl x509 -req -in certs/server.csr -CA certs/ca.crt -CAkey certs/ca.key -set_serial 0x$(openssl rand -hex 16) -days {{.CERT_DAYS}} -sha256 -extfile certs/server.ext -out certs/server.crt
      - rm certs/ca.csr certs/server.csr certs/ca.ext certs/server.ext

  test:
    desc: Run tests with the race detector (storage tests need Docker)
    cmds:
      - go test -race -count=1 ./...

  cover:
    desc: Run tests and print coverage per function and in total, without generated code
    cmds:
      - go test -count=1 -coverprofile=coverage.out ./...
      - grep -v '\.pb\.go:' coverage.out > coverage.src.out
      - go tool cover -func=coverage.src.out

  check:
    desc: Build, vet, check go.mod, formatting and test
    cmds:
      - go build ./...
      - go vet ./...
      - go mod tidy -diff
      - cmd: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"
            echo "$unformatted"
            exit 1
          fi
      - task: test
