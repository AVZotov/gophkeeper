version: '3'

vars:
  VERSION:
    sh: git describe --tags --always --dirty
  BUILD_DATE: '{{dateInZone "2006-01-02T15:04:05Z07:00" now "UTC"}}'
  LDFLAGS: -X main.version={{.VERSION}} -X main.buildDate={{.BUILD_DATE}}

tasks:
  tools:
    desc: Install the protoc plugins pinned in go.mod
    cmds:
      - go install tool

  build:
    desc: Build the client and the server into bin/
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o bin/ ./cmd/gophkeeper
      - go build -o bin/ ./cmd/server

  build:all:
    desc: Cross-compile the client for Windows, Linux and macOS
    env:
      CGO_ENABLED: '0'
    cmds:
      - for:
          matrix:
            OS: [windows, linux, darwin]
            ARCH: [amd64, arm64]
        cmd: GOOS={{.ITEM.OS}} GOARCH={{.ITEM.ARCH}} go build -ldflags "{{.LDFLAGS}}" -o bin/{{.ITEM.OS}}-{{.ITEM.ARCH}}/ ./cmd/gophkeeper

  test:
    desc: Run tests with the race detector
    cmds:
      - go test -race -count=1 ./...

  cover:
    desc: Run tests and print coverage per function and in total
    cmds:
      - go test -count=1 -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out

  check:
    desc: Build, vet, check formatting and test
    cmds:
      - task: build
      - go vet ./...
      - cmd: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"
            echo "$unformatted"
            exit 1
          fi
      - task: test
