// GophKeeper client-server contract.
//
// The server is zero-knowledge: it stores only ciphertext and the service
// fields of a record (id, revision, deletion mark). Keys, the master password
// and record contents never reach it in plaintext.
edition = "2024";

package gophkeeper.v1;

option go_package = "github.com/AVZotov/gophkeeper/api/gophkeeper/v1;gophkeeperv1";

// Proto3 semantics: an unset scalar field equals its zero value. No presence
// tracking is needed, and builders take plain values instead of pointers.
option features.field_presence = IMPLICIT;

// Auth registers users, issues access tokens and changes passwords.
//
// Only Login issues a token: after Register and ChangePassword the client
// signs in through Login.
service Auth {
  // GetSalt returns the user's Argon2id salt. It needs no token. For an
  // unknown login it returns a fake salt that is stable for that login, so
  // the response does not reveal whether the user exists.
  rpc GetSalt(GetSaltRequest) returns (GetSaltResponse);

  // Register creates a user. It needs no token. Returns AlreadyExists if
  // the login is taken.
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // Login checks the login key and returns an access token and the
  // envelope. It needs no token. Returns Unauthenticated if the login or
  // the login key is wrong.
  rpc Login(LoginRequest) returns (LoginResponse);

  // ChangePassword atomically replaces the salt, the login key hash and the
  // envelope. It needs a token and the current login key: a stolen token
  // alone is not enough. Tokens issued before the change stop working.
  // Returns Unauthenticated if the old login key is wrong.
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
}

// Vault stores and syncs the user's encrypted records. Every method needs a
// token.
service Vault {
  // Pull returns one page of records changed after the given revision,
  // ordered by revision ascending. The server chooses the page size. To get
  // the next page, the client calls Pull again with since set to the
  // revision of the last record received.
  rpc Pull(PullRequest) returns (PullResponse);

  // Push creates, updates or deletes a record using optimistic locking.
  // If base_revision differs from the record's current revision, it returns
  // Aborted with the current Record in the status details.
  rpc Push(PushRequest) returns (PushResponse);
}

// GetSaltRequest is the request for Auth.GetSalt.
message GetSaltRequest {
  // User login.
  string login = 1;
}

// GetSaltResponse is the response of Auth.GetSalt.
message GetSaltResponse {
  // Argon2id salt for the login.
  bytes salt = 1;
}

// RegisterRequest is the request for Auth.Register.
message RegisterRequest {
  // User login, unique across the server.
  string login = 1;
  // Random Argon2id salt generated by the client.
  bytes salt = 2;
  // Key derived from the password; the server stores only its hash.
  bytes login_key = 3;
  // Data key encrypted with the key derived from the password.
  bytes envelope = 4;
}

// RegisterResponse is the response of Auth.Register.
message RegisterResponse {}

// LoginRequest is the request for Auth.Login.
message LoginRequest {
  // User login.
  string login = 1;
  // Key derived from the password.
  bytes login_key = 2;
}

// LoginResponse is the response of Auth.Login.
message LoginResponse {
  // Access token (JWT) for the authorization metadata header.
  string token = 1;
  // Data key encrypted with the key derived from the password.
  bytes envelope = 2;
}

// ChangePasswordRequest is the request for Auth.ChangePassword.
message ChangePasswordRequest {
  // Login key derived from the current password.
  bytes old_login_key = 1;
  // Salt for the new password.
  bytes new_salt = 2;
  // Login key derived from the new password.
  bytes new_login_key = 3;
  // The same data key encrypted with the key derived from the new password.
  bytes new_envelope = 4;
}

// ChangePasswordResponse is the response of Auth.ChangePassword.
message ChangePasswordResponse {}

// Record is a stored record as the server sees it: service fields and
// ciphertext.
message Record {
  // Record UUID, 16 bytes in RFC 9562 binary form. Used as AAD when
  // encrypting the record.
  bytes id = 1;
  // Revision of the last change, taken from the user's revision counter.
  int64 revision = 2;
  // Tombstone mark: the record is deleted and ciphertext is empty.
  bool deleted = 3;
  // Nonce followed by the AES-256-GCM ciphertext; empty for a deleted record.
  bytes ciphertext = 4;
}

// PullRequest is the request for Vault.Pull.
message PullRequest {
  // Return records with a revision greater than this one; 0 means from the
  // beginning.
  int64 since = 1;
}

// PullResponse is the response of Vault.Pull.
message PullResponse {
  // Changed records ordered by revision ascending.
  repeated Record records = 1;
  // True if more records are left after this page.
  bool has_more = 2;
}

// PushRequest is the request for Vault.Push.
message PushRequest {
  // Record UUID, 16 bytes in RFC 9562 binary form, generated by the client.
  bytes id = 1;
  // Revision the change is based on; 0 for a new record.
  int64 base_revision = 2;
  // Nonce followed by the AES-256-GCM ciphertext; empty if deleted is true.
  bytes ciphertext = 3;
  // True to delete the record, leaving a tombstone.
  bool deleted = 4;
}

// PushResponse is the response of Vault.Push.
message PushResponse {
  // Revision assigned to the change.
  int64 revision = 1;
}
