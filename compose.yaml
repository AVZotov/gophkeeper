# PostgreSQL for development. The image matches the one in the storage tests.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: gophkeeper
      POSTGRES_PASSWORD: gophkeeper
      POSTGRES_DB: gophkeeper
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U gophkeeper -d gophkeeper]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
